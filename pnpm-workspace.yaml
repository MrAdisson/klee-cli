# Topologie monorepo — cf TECHNICAL.md §1 et docs/decisions/0001-repo-topology.md
packages:
  - apps/cli
  - apps/packages/*
  - design-system
  - docs
  - mockups

# Scripts de post-installation connus, tranchés explicitement. pnpm refuse d'en ignorer un
# en silence : sans cette liste, `pnpm install` échoue. Un script nouveau fera échouer
# l'installation de la même façon, et c'est voulu.
allowBuilds:
  core-js: false
  esbuild: true
  # Télécharge le navigateur dont le gate d'accessibilité a besoin (ADR 0018) : il doit
  # arriver avec les dépendances, pas par une étape séparée que personne ne pense à faire.
  playwright: true

# Versions imposées dans l'arbre transitif de Docusaurus : ce que des dépendances profondes
# traînent et que leur auteur n'a pas encore corrigé (paquet déprécié, avis de sécurité).
# Les portées font que chaque ligne s'efface d'elle-même quand l'amont passe au-delà.
# Même liste que celle déclarée par le provider `docs` pour les projets scaffoldés.
overrides:
  qs@<6.16.0: ^6.16.0
  serialize-javascript@<7.0.5: ^7.0.5
  uuid@<11.1.1: ^11.1.1
